[project]
name = "rag-langchain"
version = "0.1.0"
description = "A RAG pipeline built step by step with LangChain only, for learning"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1",
    "langchain-core>=1",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "numpy>=2.5.4",
    "pydantic>=2",
    "sqlalchemy>=2",
]

# The `rag` command: `uv run rag ingest | ask "…" | chat`
[project.scripts]
rag = "rag_langchain.cli:main"

# Builds src/rag_langchain into an installable package (only used at build time, not at runtime).
[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
