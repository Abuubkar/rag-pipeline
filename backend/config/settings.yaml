# Every knob of the pipeline lives here. Environment variables override it
# with the RAG_ prefix and "__" for nesting, e.g. RAG_RETRIEVAL__TOP_K=10.

dataset:
  name: yixuantt/MultiHopRAG
  revision: 71ac0d0bd1f951d2d6b70311f7d2ae404e1ffa82   # pinned HF commit

database:
  url: postgresql+psycopg://rag:rag@localhost:5433/rag

ollama:
  base_url: http://localhost:11434

llm:
  generator:
    provider: ollama
    model: gemma4:12b
    temperature: 0.0
    seed: 7
    num_ctx: 8192

embeddings:
  provider: ollama
  model: nomic-embed-text
  batch_size: 32

chunking:
  library: llamaindex     # llamaindex (sentence | semantic) or langchain (recursive)
  splitter: sentence
  chunk_size: 512        # tokens
  chunk_overlap: 64      # tokens
  contextual_header: true  # prepend title/source/date before embedding
  breakpoint_percentile: 95  # semantic only: cut where neighbour similarity falls below this percentile

retrieval:
  mode: hybrid           # dense | keyword | hybrid (keyword = Postgres full-text search)
  top_k: 6               # chunks given to the LLM
  candidates: 30         # hybrid: chunks each search brings before fusion
  rrf_k: 60              # hybrid: Reciprocal Rank Fusion constant
  query_transform: none  # none | rewrite | multi_query | hyde (an LLM call before searching)
  multi_queries: 3       # multi_query: extra queries the LLM writes
  rerank: none           # none | listwise (an LLM call after searching reorders the candidates)
  rerank_candidates: 20  # listwise: chunks searched for the LLM to reorder (top_k are kept)
  rerank_passage_chars: 600  # listwise: each candidate trimmed to this many characters

index:
  alias: default         # which index version `ask` uses (see `main.py index list`)

prompts:
  answer: answer         # config/prompts/answer.yaml
  closed_book: closed_book  # no-retrieval baseline (eval only)

evaluation:
  dev_fraction: 0.2      # dev = iterate on this; test = only for final numbers
