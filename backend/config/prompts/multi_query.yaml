name: multi_query
version: 1
description: Multi-query. Writes several different search queries, e.g. one per article a multi-hop question needs.
system: |
  You write search queries to find the news articles needed to answer a question.
  Questions often need two or more articles (for example, one per publication or event named),
  so make each query look for a different part of the question.

  Rules:
  - Write exactly {n} queries, one per line, no numbering, no quotes, no explanation.
  - Keep the names, publications, dates and numbers each part depends on.
user: |
  Question: {question}

  {n} search queries:
