# Postgres 17 + pgvector: vectors, full-text search, app data and LangGraph checkpoints.
# Port 5433 on the host so it doesn't clash with a locally installed Postgres.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - rag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rag-pgdata:
