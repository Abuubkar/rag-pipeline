<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1006 168" width="1006" height="168" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="Is the change real? Paired 95% CIs vs 3.4 · hybrid (sample)">
<style>
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-weight: 600; font-size: 14px; }
  .subtitle, .panel-title { fill: #52514e; font-size: 12px; }
  .panel-title { font-weight: 600; }
  .label { fill: #0b0b0b; font-size: 12px; }
  .value, .tick { fill: #52514e; font-size: 11px; font-variant-numeric: tabular-nums; }
