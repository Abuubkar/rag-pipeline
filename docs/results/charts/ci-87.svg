    .subtitle, .panel-title, .value, .tick { fill: #c3c2b7; }
    .value { stroke: #1a1a19; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .bar-baseline { fill: #74726c; }
    .bar-run { fill: #3987e5; }
    .ci-real { stroke: #3987e5; fill: #3987e5; }
    .ci-noise { stroke: #898781; fill: #1a1a19; }
