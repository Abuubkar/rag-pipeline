  .ref { stroke: #898781; stroke-width: 1; }
  .bar-baseline { fill: #b5b3ac; }
  .bar-run { fill: #2a78d6; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title, .label { fill: #f0efec; }
    .subtitle, .panel-title, .value, .tick { fill: #c3c2b7; }
    .value { stroke: #1a1a19; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .bar-baseline { fill: #74726c; }
    .bar-run { fill: #3987e5; }
  }
</style>
