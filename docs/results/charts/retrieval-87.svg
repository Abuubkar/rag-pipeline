<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 198" width="908" height="198" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="Retrieval: before and after">
<style>
  .surface { fill: #fcfcfb; }
